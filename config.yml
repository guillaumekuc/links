# Site Configuration

# Theme, mapped to the directory: ./theme/xxxx
theme: default

# HTML Language setting
lang: "en"

# Plugins, implemented in ./plugins/PLUGIN_NAME
# Use {{ vars.PLUGIN_NAME }} in the settings below

# The output of the plugin can be used below, e.g., {{vars.MediumFollowersCountPlugin}}
plugins:
  # Automatically fetch Medium follower count
  # - MediumFollowersCountPlugin:
      # username: GuillaumeKuc
  # Automatically fetch Github repo star count
  # - GithubRepoStarsCountPlugin:
      #- Guillaume Kuc/ZMarkupParser
      #- Guillaume Kuc/ZReviewTender
      #- Guillaume Kuc/ZMediumToMarkdown
      #- Guillaume Kuc/linkyee

# Google Analytics tracking id
google_analytics_id:

# HTML Title
title: "Guillaume Kuc – Links"

# Avatar image path
avatar: "./images/profile.jpeg"

# Name section text
name: "Guillaume Kuc"

# Tagline section text
tagline: >-
    2D · 3D · Music · Code | Technical Art

# List of links
# icon: Use Font Awesome icons (https://fontawesome.com/search?o=r&m=free)
# text: The displayed text for the link
# title: The url title
# url: The URL of the link
# alt: Alternative text for accessibility
# target: `_blank` opens in a new tab, `_self` opens in the same frame
links:
  - link:
      icon: "fa-solid fa-house"
      text: "Portfolio"
      url: "https://guillaumekuc.art/"
      title: "Portfolio"
      target: "_blank"
  - link:
      icon: "fa-brands fa-artstation"
      text: "ArtStation"
      url: "https://www.artstation.com/guillaumekuc"
      title: "ArtStation"
      target: "_blank"
  - link:
      icon: "fa-brands fa-github"
      text: "GitHub"
      url: "https://github.com/guillaumekuc"
      title: "GitHub"
      target: "_blank"
  - link:
      icon: "fa-brands fa-soundcloud"
      text: "SoundCloud"
      url: "https://soundcloud.com/guillaumekuc"
      title: "SoundCloud"
      target: "_blank"
  - link:
      icon: "fa-solid fa-pen"
      text: "Blog"
      url: "https://guillaumekuc.github.io/blog/"
      title: "Blog"
      target: "_blank"
  - link:
      icon: "fa-solid fa-briefcase"
      text: "Resume"
      url: "https://guillaumekuc.github.io/resume/"
      title: "Resume"
      target: "_blank"
  - link:
      icon: "fa-solid fa-store"
      text: "Gumroad"
      url: "https://guillaumekuc.gumroad.com/"
      title: "Gumroad"
      target: "_blank"
  - link:
      icon: "fa-solid fa-envelope"
      text: "Contact"
      url: "mailto:guillaume@guillaumekuc.com"
      title: "Email: guillaume@guillaumekuc.com"
      class: "highlight"

# List of social media links
# icon: Use Font Awesome icons (https://fontawesome.com/search?o=r&m=free)
# title: The url title
# url: The URL of the social media link
# alt: Alternative text for accessibility
# target: _blank opens in a new tab, _self opens in the same frame

# Footer text
footer: >
    © 2026 Guillaume Kuc · Grenoble Metropolitan area, France · guillaume[at]guillaumekuc.com

# Footer copyright message
# Linkyee is a 100% free, open-source project—feel free to modify the copyright message as you like. :)
copyright: >
  Powered by <a href="https://github.com/ZhgChgLi/linkyee" target="_blank">linkyee</a>
